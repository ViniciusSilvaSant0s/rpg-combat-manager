services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    command:
      - sh
      - -c
      - npm ci && npm run dev
    environment:
      PORT: 3000
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: 1000
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./server:/app
      - server_node_modules:/app/node_modules
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/health').then((response)=>{if(!response.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  front:
    build:
      context: ./rcm-front
      dockerfile: Dockerfile
    command:
      - sh
      - -c
      - npm ci && npm run dev
    environment:
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: 1000
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      server:
        condition: service_healthy
    volumes:
      - ./rcm-front:/app
      - rcm_front_node_modules:/app/node_modules

volumes:
  server_node_modules:
  rcm_front_node_modules:
